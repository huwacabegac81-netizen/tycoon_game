<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BetBoom Tycoon</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #111; /* Темный фон */
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Чтобы не скроллилось все окно */
            touch-action: manipulation; /* Улучшает реакцию на тапы */
        }

        /* Верхняя панель */
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }

        h1 {
            color: #ff0000; /* Фирменный красный */
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .balance-container {
            font-size: 32px;
            font-weight: bold;
            margin-top: 10px;
        }

        .income-info {
            font-size: 14px;
            color: #888;
            margin-top: 5px;
        }

        /* Главная кнопка */
        .click-area {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #click-btn {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #ff0000 0%, #990000 100%);
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            font-size: 24px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Убирает синий квадрат при клике */
        }

        #click-btn:active {
            transform: scale(0.95);
        }

        /* Магазин */
        .shop {
            width: 100%;
            height: 35%;
            background-color: #222;
            border-radius: 15px 15px 0 0;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .shop-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ccc;
        }

        .upgrade-item {
            background-color: #333;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-info div:first-child {
            font-weight: bold;
        }
        .upgrade-info div:last-child {
            font-size: 12px;
            color: #aaa;
        }

        .upgrade-cost {
            color: #ff0000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>BB Tycoon</h1>
        <div class="balance-container"><span id="balance">0</span> ₽</div>
        <div class="income-info">Прибыль: <span id="passive">0</span> ₽/сек</div>
    </div>

    <div class="click-area">
        <div id="click-btn">ПРИНЯТЬ<br>СТАВКУ</div>
    </div>

    <div class="shop">
        <div class="shop-title">Улучшения клуба</div>
        <div id="upgrades-list"></div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Раскрыть на весь экран
        
        // Переменные игры
        let balance = 0;
        let profitPerSecond = 0;
        let clickValue = 100; // Ставка за клик

        // Список улучшений (как мы обсуждали: диваны, тв, бар)
        const upgrades = [
            { id: 1, name: "Удобный диван", cost: 1500, profit: 50 },
            { id: 2, name: "Плазма 4K", cost: 5000, profit: 200 },
            { id: 3, name: "Пивной кран", cost: 15000, profit: 700 },
            { id: 4, name: "VIP комната", cost: 50000, profit: 2500 }
        ];

        // Элементы интерфейса
        const balanceEl = document.getElementById('balance');
        const passiveEl = document.getElementById('passive');
        const upgradesListEl = document.getElementById('upgrades-list');
        const clickBtn = document.getElementById('click-btn');

        // Клик по кнопке
        clickBtn.addEventListener('click', () => {
            balance += clickValue;
            updateUI();
            
            // Вибрация телефона (Haptic Feedback) - фишка Телеграма
            tg.HapticFeedback.impactOccurred('light');
        });

        // Покупка улучшений
        function buyUpgrade(upgrade) {
            if (balance >= upgrade.cost) {
                balance -= upgrade.cost;
                profitPerSecond += upgrade.profit;
                upgrade.cost = Math.floor(upgrade.cost * 1.3); // Удорожание на 30%
                
                tg.HapticFeedback.notificationOccurred('success'); // Вибрация успеха
                renderShop();
                updateUI();
            } else {
                tg.HapticFeedback.notificationOccurred('error'); // Вибрация ошибки
            }
        }

        // Отрисовка магазина
        function renderShop() {
            upgradesListEl.innerHTML = '';
            upgrades.forEach(u => {
                const div = document.createElement('div');
                div.className = `upgrade-item ${balance < u.cost ? 'disabled' : ''}`;
                div.innerHTML = `
                    <div class="upgrade-info">
                        <div>${u.name}</div>
                        <div>+${u.profit} ₽/сек</div>
                    </div>
                    <div class="upgrade-cost">${u.cost} ₽</div>
                `;
                div.onclick = () => buyUpgrade(u);
                upgradesListEl.appendChild(div);
            });
        }

        // Обновление интерфейса
        function updateUI() {
            balanceEl.innerText = Math.floor(balance);
            passiveEl.innerText = profitPerSecond;
            renderShop(); // Перерисовываем, чтобы обновить доступность кнопок
        }

        // Пассивный доход (раз в секунду)
        setInterval(() => {
            if (profitPerSecond > 0) {
                balance += profitPerSecond;
                updateUI();
            }
        }, 1000);

        // Сохранение прогресса при закрытии (опционально, но полезно)
        tg.onEvent('viewportChanged', updateUI); // Просто чтобы триггернуть обновление

        renderShop();
    </script>
</body>
</html>

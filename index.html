<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BetBoom Tycoon</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <script>
        window.onerror = function(msg, url, line) {
            // Если React не загрузился, создаем блок ошибки
            if (!document.getElementById('root').hasChildNodes()) {
                const errBox = document.createElement('div');
                errBox.style.cssText = 'position:fixed;top:0;left:0;background:red;color:white;padding:20px;z-index:9999;font-size:12px;width:100%';
                errBox.innerHTML = '<b>ОШИБКА ЗАГРУЗКИ:</b><br>' + msg + '<br>Line: ' + line;
                document.body.appendChild(errBox);
            }
        };
    </script>

    <style>
        /* Базовые настройки поведения страницы */
        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            overscroll-behavior: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #111827;
        }
        
        /* Анимации */
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(1.1); opacity: 0; } }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-popIn { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .animate-click { transform: scale(0.95); }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 2px; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-[100dvh] overflow-hidden w-full">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // =================================================================================================
        // БЛОК 1: НАСТРОЙКИ И БАЛАНС 
        // =================================================================================================

        const GAME_CONFIG = {
            tickSpeed: 1000,   // Скорость игры в мс (1000 = 1 секунда)
            saveInterval: 10000 
        };

        // Начальное состояние
        const INITIAL_STATE = {
            money: 0,
            gameTime: 0,
            queue: 0,
            hall: [],
            soundEnabled: true,
            upgrades: { /* Заполнится автоматически */ }
        };

        // СПИСОК ВСЕХ ТОВАРОВ
        const UPGRADES_CONFIG = {
            click_energy:     { id: 'click_energy', category: 'click', name: 'Энергетики', basePrice: 10, desc: '+$1 к клику', effect: lvl => lvl * 1 },
            marketing_flyers: { id: 'marketing_flyers', category: 'marketing', name: 'Нанять промоутеров', basePrice: 20, desc: '+1 гость в час', effect: lvl => lvl * 1 },
            club_vent:        { id: 'club_vent', category: 'club', name: 'Вентилятор', basePrice: 30, desc: '+1 сек в зале', effect: lvl => lvl * 1 },
            queue_sign:       { id: 'queue_sign', category: 'club', name: 'Вывеска на здании', basePrice: 40, desc: '+1 место на в очереди', effect: lvl => lvl * 1 },
            bet_snacks:       { id: 'bet_snacks', category: 'club', name: 'Орешки', basePrice: 50, desc: '+$1 к ставке', effect: lvl => lvl * 1 },
            click_keyboard:   { id: 'click_keyboard', category: 'click', name: 'RGB Мышка', basePrice: 75, desc: '+$2 к клику', effect: lvl => lvl * 2 },
            club_chairs:      { id: 'club_chairs', category: 'club', name: 'Табуретки', basePrice: 80, desc: '+2 сек в зале', effect: lvl => lvl * 2 },
            click_crm:        { id: 'click_crm', category: 'click', name: 'CRM Система', basePrice: 100, desc: '+$3 к клику', effect: lvl => lvl * 3 },
            marketing_ads:    { id: 'marketing_ads', category: 'marketing', name: 'Реклама', basePrice: 1000, desc: '+2 гостя в час', effect: lvl => lvl * 2 },
            club_repair:      { id: 'club_repair', category: 'club', name: 'Ремонт в клубе', basePrice: 1000, desc: '+2 сек в зале', effect: lvl => lvl * 2 },
            marketing_spam:   { id: 'marketing_spam', category: 'marketing', name: 'Рассылка', basePrice: 120, desc: '+3 гостя в час', effect: lvl => lvl * 3 },
            bet_drinks:       { id: 'bet_drinks', category: 'club', name: 'Welcome-оффер', basePrice: 150, desc: '+$2 к ставке', effect: lvl => lvl * 2 },
            staff_manager:    { id: 'staff_manager', category: 'staff', name: 'Нанять менеджера', basePrice: 200, desc: 'Авто-вход (1/сек)', effect: lvl => lvl * 1 },
            queue_shade:      { id: 'queue_shade', category: 'club', name: 'Тент', basePrice: 250, desc: '+2 места на улице', effect: lvl => lvl * 2 },
            queue_barrier:    { id: 'queue_barrier', category: 'club', name: 'Ограждение', basePrice: 500, desc: '+3 места на улице', effect: lvl => lvl * 3 },
            marketing_smm:    { id: 'marketing_smm', category: 'marketing', name: 'SMM Отдел', basePrice: 600, desc: '+4 гостя в час', effect: lvl => lvl * 4 },
            club_expand:      { id: 'club_expand', category: 'club', name: 'Расширение клуба', basePrice: 1000, desc: '+2 места в клубе', effect: lvl => lvl * 2 },
            staff_vip_manager:{ id: 'staff_vip_manager', category: 'staff', name: 'Нанять VIP-менеджера', basePrice: 1000, desc: '+$3 к ставке', effect: lvl => lvl * 3 },
            marketing_ambas:  { id: 'marketing_ambas', category: 'marketing', name: 'Подписать амбассадора', basePrice: 1000, desc: '+5 гостей в час', effect: lvl => lvl * 5 },
            club_sofa:        { id: 'club_sofa', category: 'club', name: 'Мягкие диваны', basePrice: 1200, desc: '+3 сек в зале', effect: lvl => lvl * 3 },
            click_gold:       { id: 'click_gold', category: 'click', name: 'Золотой палец', basePrice: 1500, desc: '+$2 к клику', effect: lvl => lvl * 2 },
            bet_facecontrol:  { id: 'bet_facecontrol', category: 'club', name: 'Фейс-контроль', basePrice: 2000, desc: '+$2 к ставке', effect: lvl => lvl * 2 },
            club_karaoke:     { id: 'club_karaoke', category: 'club', name: 'Караоке', basePrice: 3500, desc: '+2 сек в зале', effect: lvl => lvl * 2 },
            marketing_tv:     { id: 'marketing_tv', category: 'marketing', name: 'Реклама на ТВ', basePrice: 4000, desc: '+3 гостя/час', effect: lvl => lvl * 3 },
            bet_bar:          { id: 'bet_bar', category: 'club', name: 'Премиум Бар', basePrice: 5000, desc: '+$5 к ставке', effect: lvl => lvl * 5 },
            click_crypto:     { id: 'click_crypto', category: 'click', name: 'Инвестиции в криту', basePrice: 5000, desc: '+$10 к клику', effect: lvl => lvl * 10 },
            club_floor2:      { id: 'club_floor2', category: 'club', name: 'Построить дополнительный этаж', basePrice: 7000, desc: '+4 места', effect: lvl => lvl * 4 },
            marketing_sponsor:{ id: 'marketing_sponsor', category: 'marketing', name: 'Спонсирование ФК', basePrice: 10000, desc: '+$1 к ставке', effect: lvl => lvl * 1 },
            staff_director:   { id: 'staff_director', category: 'staff', name: 'Нанять управляющего', basePrice: 10000, desc: '+1 сек в зале', effect: lvl => lvl * 1 },
            club_vip:         { id: 'club_vip', category: 'club', name: 'Вип ложа', basePrice: 10000, desc: '+$1 к ставке', effect: lvl => lvl * 1 },
        };

        Object.keys(UPGRADES_CONFIG).forEach(key => INITIAL_STATE.upgrades[key] = 0);

        // =================================================================================================
        // БЛОК 2: ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // =================================================================================================

        // 1. Звук
        const audioCtx = { current: null };
        const playSound = (type) => {
            try {
                if (!audioCtx.current) audioCtx.current = new (window.AudioContext || window.webkitAudioContext)();
                const ctx = audioCtx.current;
                if (ctx.state === 'suspended') ctx.resume();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;
                if (type === 'click') {
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'buy') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'enter') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                }
            } catch (e) { /* tishina */ }
        };

        // 2. Вибрация
        const triggerHaptic = (style = 'medium') => {
            if (!navigator.vibrate) return;
            if (style === 'light') navigator.vibrate(5);
            if (style === 'medium') navigator.vibrate(10);
            if (style === 'success') navigator.vibrate([10, 30, 10]);
        };

        // 3. Форматирование
        const formatMoney = (val) => Math.floor(val).toLocaleString('en-US').replace(/,/g, ' ');
        const formatTime = (h) => `${Math.floor(h/24)}д ${h%24}ч`;

        // 4. Цена
        const getPrice = (key, currentLevel) => {
            const base = UPGRADES_CONFIG[key].basePrice;
            return Math.floor(base * Math.pow(1.4, currentLevel));
        };

        // =================================================================================================
        // БЛОК 3: ИКОНКИ И КОМПОНЕНТЫ
        // =================================================================================================

        const Icons = {
            User: ({size, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Dollar: ({size, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
            Clock: ({size, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Check: ({size, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>,
            Trend: ({size, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            Play: ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>,
            Star: ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
            Briefcase: ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
            PlusUser: ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>,
            ChevronUp: ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="18 15 12 9 6 15"/></svg>,
            ChevronDown: ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"/></svg>,
            Settings: ({size, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
            X: ({size, className}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        };

        const UpgradeItem = ({ config, level, money, onBuy }) => {
            const cost = getPrice(config.id, level);
            const canBuy = money >= cost;
            
            let IconComponent = Icons.Star;
            let colorClass = "text-purple-500";
            if (config.category === 'click') { IconComponent = Icons.Play; colorClass = "text-yellow-500"; }
            if (config.category === 'marketing') { IconComponent = Icons.Briefcase; colorClass = "text-blue-500"; }
            if (config.category === 'staff') { IconComponent = Icons.PlusUser; colorClass = "text-green-500"; }

            return (
                <div 
                    onClick={() => canBuy && onBuy(config.id)} 
                    className={`flex justify-between items-center p-3 rounded-lg border transition-all active:scale-[0.98] touch-manipulation 
                    ${canBuy ? 'bg-gray-800 border-gray-700 hover:border-gray-600 cursor-pointer' : 'bg-gray-800/50 border-transparent opacity-60'}`}
                >
                    <div className="flex items-center gap-3">
                        <div className={`p-2 rounded-lg bg-gray-900 ${colorClass}`}>
                            <IconComponent size={16} />
                        </div>
                        <div>
                            <div className="text-sm font-bold text-gray-200 leading-tight">
                                {config.name} <span className="text-gray-500 text-[10px]">Lvl {level}</span>
                            </div>
                            <div className="text-[10px] text-gray-400">{config.desc}</div>
                        </div>
                    </div>
                    <div className={`text-sm font-bold px-3 py-1 rounded ${canBuy ? 'bg-green-600/20 text-green-400' : 'text-gray-500'}`}>
                        ${formatMoney(cost)}
                    </div>
                </div>
            );
        };

        // =================================================================================================
        // БЛОК 4: ГЛАВНАЯ ИГРА
        // =================================================================================================

        function BetBoomTycoonMobile() {
            const [state, setState] = useState(INITIAL_STATE);
            const [isGameStarted, setIsGameStarted] = useState(false);
            const [isShopExpanded, setShopExpanded] = useState(false);
            const [isSettingsOpen, setSettingsOpen] = useState(false); // Новое состояние
            const [floats, setFloats] = useState([]);
            
            const stateRef = useRef(state);
            const spawnAccumulator = useRef(0);
            const clickAnimRef = useRef(null);
            
            useEffect(() => { stateRef.current = state; }, [state]);

            // Расчеты
            const calcStats = useCallback((ups) => {
                const check = (id) => UPGRADES_CONFIG[id]?.effect(ups[id]) || 0;
                return {
                    maxQueue: 5 + check('queue_barrier') + check('queue_sign') + check('queue_shade'),
                    maxHall: 5 + check('club_expand') + check('club_floor2'),
                    clickVal: 1 + check('click_crm') + check('click_gold') + check('click_crypto') + check('click_energy') + check('click_keyboard'),
                    guestLife: 1 + check('club_repair') + check('staff_director') + check('club_sofa') + check('club_karaoke') + check('club_vent') + check('club_chairs'),
                    betAmount: 1 + check('club_vip') + check('marketing_sponsor') + check('staff_vip_manager') + check('bet_facecontrol') + check('bet_bar') + check('bet_snacks') + check('bet_drinks'),
                    spawnRate: 1 + check('marketing_ads') + check('marketing_ambas') + check('marketing_smm') + check('marketing_tv') + check('marketing_flyers') + check('marketing_spam')
                };
            }, []);

            // --- ЗАГРУЗКА И СОХРАНЕНИЕ ---
            useEffect(() => {
                const saved = localStorage.getItem('betboom_save_clean_v1');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        const mergedUpgrades = { ...INITIAL_STATE.upgrades, ...parsed.upgrades };
                        // Проверяем настройку звука (по умолчанию true)
                        const soundEnabled = parsed.soundEnabled !== undefined ? parsed.soundEnabled : true;
                        setState(prev => ({ ...prev, ...parsed, upgrades: mergedUpgrades, soundEnabled }));
                    } catch (e) { console.error("Save load error", e); }
                }
                
                // Функция сохранения
                const saveGame = () => {
                    try {
                        localStorage.setItem('betboom_save_clean_v1', JSON.stringify(stateRef.current));
                    } catch (e) { console.error("Save error", e); }
                };

                // Таймер
                const saveInterval = setInterval(saveGame, GAME_CONFIG.saveInterval);
                
                // Сохранение при выходе
                window.addEventListener('beforeunload', saveGame);
                window.addEventListener('unload', saveGame); // Для мобилок

                return () => {
                    clearInterval(saveInterval);
                    window.removeEventListener('beforeunload', saveGame);
                    window.removeEventListener('unload', saveGame);
                };
            }, []);

            // --- ИГРОВОЙ ЦИКЛ ---
            useEffect(() => {
                const loop = setInterval(() => {
                    const current = stateRef.current;
                    const stats = calcStats(current.upgrades);
                    
                    let { queue, hall, money, gameTime } = current;
                    let moneyDelta = 0;

                    // Спавн
                    if (queue < stats.maxQueue) {
                        spawnAccumulator.current += stats.spawnRate;
                        if (spawnAccumulator.current >= 1) {
                            const toAdd = Math.floor(spawnAccumulator.current);
                            spawnAccumulator.current -= toAdd;
                            queue = Math.min(queue + toAdd, stats.maxQueue);
                        }
                    }

                    // Обработка
                    const activeGuests = [];
                    hall.forEach(guest => {
                        const isLoss = Math.random() < 0.2; 
                        const amount = stats.betAmount;

                        if (isLoss) {
                            moneyDelta -= amount;
                            spawnFloat(`-$${amount.toFixed(1)}`, 'bad');
                        } else {
                            moneyDelta += amount;
                            spawnFloat(`+$${amount.toFixed(1)}`, 'good');
                        }

                        if (guest.timeLeft > 1) {
                            activeGuests.push({ ...guest, timeLeft: guest.timeLeft - 1 });
                        }
                    });

                    // Менеджер
                    const managerLvl = current.upgrades.staff_manager;
                    if (managerLvl > 0) {
                        const freeSlots = stats.maxHall - activeGuests.length;
                        if (freeSlots > 0 && queue > 0) {
                            const moveCount = Math.min(freeSlots, queue, managerLvl);
                            for (let i = 0; i < moveCount; i++) {
                                activeGuests.push({ id: Date.now() + Math.random(), timeLeft: stats.guestLife });
                            }
                            queue -= moveCount;
                        }
                    }

                    setState(prev => ({
                        ...prev,
                        gameTime: gameTime + 1,
                        money: Math.max(0, money + moneyDelta),
                        queue,
                        hall: activeGuests
                    }));

                }, GAME_CONFIG.tickSpeed);

                return () => clearInterval(loop);
            }, [calcStats]);

            const spawnFloat = (text, type, xPercent = null) => {
                const id = Date.now() + Math.random();
                const x = xPercent !== null ? xPercent : 20 + Math.random() * 60;
                setFloats(prev => [...prev, { id, text, type, x }]);
                setTimeout(() => setFloats(prev => prev.filter(f => f.id !== id)), 800);
            };

const handleManualMove = () => {
                const stats = calcStats(state.upgrades);
                if (state.queue > 0 && state.hall.length < stats.maxHall) {
                    setState(prev => ({
                        ...prev,
                        queue: prev.queue - 1,
                        hall: [...prev.hall, { id: Date.now(), timeLeft: stats.guestLife }]
                    }));
                    triggerHaptic('light');
                    if (state.soundEnabled) playSound('enter');
                }
            };

            const handleClick = () => {
                const stats = calcStats(state.upgrades);
                if (clickAnimRef.current) {
                    clickAnimRef.current.classList.remove('animate-click');
                    void clickAnimRef.current.offsetWidth;
                    clickAnimRef.current.classList.add('animate-click');
                }
                setState(prev => ({ ...prev, money: prev.money + stats.clickVal }));
                spawnFloat(`+$${stats.clickVal.toFixed(1)}`, 'click', 50);
                triggerHaptic('medium');
                if (state.soundEnabled) playSound('click');
            };

            const handleBuy = (id) => {
                const lvl = state.upgrades[id];
                const cost = getPrice(id, lvl);
                if (state.money >= cost) {
                    setState(prev => ({
                        ...prev,
                        money: prev.money - cost,
                        upgrades: { ...prev.upgrades, [id]: lvl + 1 }
                    }));
                    triggerHaptic('success');
                    if (state.soundEnabled) playSound('buy');
                }
            };

            const handleReset = () => {
                if (confirm('Ты уверен? Весь прогресс будет удален безвозвратно.')) {
                    localStorage.removeItem('betboom_save_clean_v1');
                    window.location.reload();
                }
            };

            const stats = calcStats(state.upgrades);
            const incomePerSec = state.hall.length * stats.betAmount * 0.4;

// СТАРТОВОЕ МЕНЮ
            if (!isGameStarted) {
                return (
                    <div className="fixed inset-0 z-50 bg-gray-900 flex flex-col items-center justify-center p-6 text-center overflow-hidden">
                        <div className="mb-8 animate-popIn">
                            <h1 className="text-4xl font-black text-yellow-400 uppercase tracking-tighter drop-shadow-lg">BetBoom</h1>
                            <span className="text-2xl font-bold text-white tracking-widest uppercase bg-red-600 px-2 transform -skew-x-12 inline-block">Tycoon</span>
                        </div>
                        <div className="max-w-md space-y-4 mb-8">
                            <p className="text-white text-lg font-bold leading-snug">Поздравляю, вы стали владельцем клуба!</p>
                            <p className="text-gray-400 text-sm">Принимай гостей, делай выручку и улучшай заведение.</p>
                        </div>
                        <button onClick={() => { setIsGameStarted(true); if(state.soundEnabled) playSound('buy'); triggerHaptic('success'); }}
                            className="w-full max-w-xs py-4 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 text-white font-black text-xl rounded-xl shadow-lg uppercase tracking-wider active:scale-95 transition-all animate-popIn">
                            Открыть клуб
                        </button>
                    </div>
                );
            }

            // ИНТЕРФЕЙС
            return (
                <div className="flex flex-col h-[100dvh] w-full">
                    {/* МОДАЛЬНОЕ ОКНО НАСТРОЕК */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4 animate-popIn backdrop-blur-sm">
                            <div className="bg-gray-800 border border-gray-700 p-6 rounded-2xl w-full max-w-sm relative shadow-2xl">
                                <button onClick={() => setSettingsOpen(false)} className="absolute top-4 right-4 text-gray-400 active:scale-90">
                                    <Icons.X size={24} />
                                </button>
                                <h2 className="text-2xl font-black text-white mb-6 uppercase tracking-wider text-center">Настройки</h2>
                                
                                <div className="space-y-4">
                                    <div onClick={() => setState(prev => ({...prev, soundEnabled: !prev.soundEnabled}))} 
                                         className="flex items-center justify-between p-4 bg-gray-900 rounded-xl active:scale-95 transition-transform cursor-pointer border border-gray-700">
                                        <div className="flex items-center gap-3">
                                            {state.soundEnabled ? <Icons.Play size={20} className="text-green-400"/> : <Icons.X size={20} className="text-red-400"/>}
                                            <span className="font-bold text-gray-200 uppercase text-sm">Звук</span>
                                        </div>
                                        <div className={`w-12 h-6 rounded-full relative transition-colors ${state.soundEnabled ? 'bg-green-500' : 'bg-gray-600'}`}>
                                            <div className={`absolute top-1 w-4 h-4 rounded-full bg-white transition-all shadow-sm ${state.soundEnabled ? 'left-7' : 'left-1'}`} />
                                        </div>
                                    </div>

                                    <button onClick={handleReset} className="w-full p-4 bg-red-900/30 border border-red-500/50 text-red-400 font-bold rounded-xl active:scale-95 transition-transform uppercase text-sm flex items-center justify-center gap-2 hover:bg-red-900/50">
                                        <Icons.X size={16} /> Сбросить прогресс
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Верхняя панель */}
                    <div className="flex-none bg-gray-800 p-3 border-b border-gray-700 shadow-xl z-20">
                        <div className="flex justify-between items-start">
                            <div className="flex flex-col">
                                <span className="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Баланс</span>
                                <div className="flex items-end gap-2">
                                    <div className="text-yellow-400 text-2xl font-black leading-none flex items-center gap-1">
                                        <Icons.Dollar size={20} className="stroke-2" /> {formatMoney(state.money)}
                                    </div>
                                    <div className={`text-xs font-bold mb-0.5 animate-pulse ${incomePerSec > 0 ? 'text-green-400' : 'text-gray-500'}`}>
                                        {incomePerSec > 0 ? '+' : ''}{incomePerSec.toFixed(1)}/сек
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <div className="flex flex-col items-end">
                                    <span className="text-[10px] text-gray-400 uppercase font-bold tracking-widest">Время</span>
                                    <div className="text-white text-lg font-bold leading-none flex items-center gap-1">
                                        {formatTime(state.gameTime)} <Icons.Clock size={16} />
                                    </div>
                                </div>
                                <button onClick={() => setSettingsOpen(true)} className="p-2 bg-gray-700 rounded-lg text-gray-300 active:scale-90 transition-transform">
                                    <Icons.Settings size={20} />
                                </button>
                            </div>
                        </div>
                        <div className="mt-3 flex items-center justify-between text-[10px] text-gray-500 font-bold uppercase">
                            <span>Гости: {state.hall.length} / {stats.maxHall}</span>
                            <span>Очередь: {state.queue} / {stats.maxQueue}</span>
                        </div>
                        <div className="w-full h-1.5 bg-gray-700 rounded-full mt-1 overflow-hidden">
                           <div className="h-full bg-gradient-to-r from-purple-600 to-purple-400 transition-all duration-300" style={{ width: `${(state.hall.length / stats.maxHall) * 100}%` }} />
                        </div>
                    </div>

                    {/* Игровая зона */}
                    <div className={`relative flex flex-col bg-gray-900 transition-all duration-300 ${isShopExpanded ? 'flex-[0]' : 'flex-1 min-h-0'}`}>
                        <div className="absolute inset-0 pointer-events-none z-50 overflow-hidden">
                            {floats.map(f => (
                                <div key={f.id} className={`absolute font-black text-xl drop-shadow-md ${f.type === 'good' ? 'text-green-400' : f.type === 'bad' ? 'text-red-500' : 'text-yellow-400 text-3xl'}`} 
                                     style={{ left: `${f.x}%`, top: '30%', animation: 'floatUp 0.8s ease-out forwards' }}>
                                    {f.text}
                                </div>
                            ))}
                        </div>

                        {/* Очередь */}
                        <div className="bg-gray-800/40 border-b border-gray-700/50 relative flex flex-col justify-center items-center py-2 shrink-0">
                           <div className="absolute top-1 left-2 text-[10px] text-gray-600 font-bold uppercase">Очередь</div>
                           <div className="flex items-center justify-center gap-[-5px] h-10 mb-1 w-full overflow-hidden">
                             {Array.from({ length: Math.min(15, state.queue) }).map((_, i) => (
                               <div key={i} className="animate-popIn -ml-2 first:ml-0 relative z-0">
                                   <div className="w-8 h-8 rounded-full bg-gray-700 border-2 border-gray-800 flex items-center justify-center">
                                     <Icons.User size={16} className="text-gray-400" />
                                   </div>
                               </div>
                             ))}
                             {state.queue > 15 && <span className="ml-2 text-gray-500 font-bold text-xs">+{state.queue - 15}</span>}
                           </div>
                           <button onClick={handleManualMove} disabled={state.queue === 0 || state.hall.length >= stats.maxHall} 
                                   className={`px-4 py-1 rounded-full font-bold text-[10px] uppercase tracking-wider border transition-all active:scale-95 ${state.queue > 0 && state.hall.length < stats.maxHall ? 'bg-green-600/20 border-green-500 text-green-400' : 'bg-transparent border-gray-700 text-gray-600'}`}>
                             Запустить
                           </button>
                        </div>

                        {/* Зал */}
                        <div className="flex-1 p-3 overflow-y-auto bg-gray-900 content-start">
                           <div className="grid grid-cols-5 gap-3 pb-4">
                             {state.hall.map((guest) => {
                                 const progress = guest.timeLeft / stats.guestLife;
                                 const radius = 18;
                                 const circumference = 2 * Math.PI * radius;
                                 const offset = circumference - (progress * circumference);
                                 return (
                                   <div key={guest.id} className="relative flex flex-col items-center justify-center animate-popIn">
                                     <div className="relative w-12 h-12 flex items-center justify-center">
                                         <svg className="absolute inset-0 w-full h-full -rotate-90">
                                             <circle cx="24" cy="24" r={radius} stroke="#374151" strokeWidth="3" fill="transparent" />
                                             <circle cx="24" cy="24" r={radius} stroke="#a855f7" strokeWidth="3" fill="transparent" strokeDasharray={circumference} strokeDashoffset={offset} strokeLinecap="round" className="transition-all duration-1000 ease-linear" />
                                         </svg>
                                         <div className="w-8 h-8 bg-gray-800 rounded-full flex items-center justify-center relative z-10">
                                            <Icons.User size={16} className="text-gray-200" />
                                         </div>
                                     </div>
                                   </div>
                                 );
                             })}
                           </div>
                        </div>
                    </div>

                    {/* Магазин и Кнопка */}
                    <div className={`flex-none bg-gray-800 border-t border-gray-700 flex flex-col transition-all duration-300 ease-in-out z-40 shadow-[0_-5px_20px_rgba(0,0,0,0.5)] ${isShopExpanded ? 'fixed bottom-0 left-0 right-0 h-[85dvh] rounded-t-3xl' : 'h-[42dvh] relative'}`}>
                        {!isShopExpanded && (
                            <div className="p-3 bg-gray-800 z-10 shadow-lg">
                              <button ref={clickAnimRef} onClick={handleClick} className="w-full h-14 bg-gradient-to-r from-amber-500 to-yellow-600 rounded-xl flex items-center justify-center gap-3 text-white font-black text-xl uppercase tracking-wider shadow-[0_4px_0_rgb(180,83,9)] active:translate-y-[4px] active:shadow-none transition-all touch-manipulation group">
                                <Icons.Trend size={24} className="group-active:scale-110 transition-transform" /> Сделать ставку
                              </button>
                            </div>
                        )}

                        <div className="flex-1 flex flex-col min-h-0 bg-gray-900">
                          <div onClick={() => setShopExpanded(!isShopExpanded)} className="flex items-center justify-between px-4 py-3 bg-gray-800 cursor-pointer border-b border-gray-700 active:bg-gray-700 transition-colors">
                              <div className="text-xs text-gray-400 font-bold uppercase tracking-widest">Магазин улучшений</div>
                              <div className="text-gray-400">{isShopExpanded ? <Icons.ChevronDown size={20}/> : <Icons.ChevronUp size={20}/>}</div>
                          </div>
                          <div className="flex-1 overflow-y-auto px-3 py-2 pb-safe space-y-2">
                            {Object.values(UPGRADES_CONFIG).map((u) => (
                                <UpgradeItem key={u.id} config={u} level={state.upgrades[u.id]} money={state.money} onBuy={handleBuy} />
                            ))}
                            <div className="h-10"></div>
                          </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BetBoomTycoonMobile />);
    </script>
</body>
</html>
